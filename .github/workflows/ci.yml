name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build VoxPad.sln -c Release --nologo
      - name: Test
        # Real-cable integration tests skip themselves when VB-CABLE is absent (it is, on hosted runners).
        run: dotnet test tests/VoxPad.Tests -c Release --nologo --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/VoxPad.Tests/TestResults/*.trx
