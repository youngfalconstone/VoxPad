name: Release

# Push a tag like v1.0.1 → builds x64 + ARM64 installers and portable zips and attaches them to the GitHub release.
# The download button on the GitHub Pages site picks the newest release automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        id: v
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF.Substring(11) } else { '1.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build, test, publish, MSI
        shell: pwsh
        run: ./build.ps1 -Version ${{ steps.v.outputs.version }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VoxPad ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/installer/*.msi
            artifacts/*.zip
            artifacts/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: VoxPad-${{ steps.v.outputs.version }}
          path: |
            artifacts/installer/*.msi
            artifacts/*.zip
            artifacts/*.exe
